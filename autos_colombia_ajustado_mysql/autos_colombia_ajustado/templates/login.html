{% extends "base.html" %}{% block title %}Acceso{% endblock %}
{% block content %}<section class="card login"><h2>Ingreso al sistema</h2>
<form method="post">
<label>Correo electrónico o usuario<input name="usuario" placeholder="Ingrese su correo o usuario" required autocomplete="username"></label>
<label>Contraseña<input type="password" name="password" placeholder="Ingrese su contraseña" required autocomplete="current-password"></label>
<button>Ingresar</button></form>
<p class="muted">Ingrese con las credenciales asignadas por el administrador del parqueadero.</p>
</section>{% endblock %}
